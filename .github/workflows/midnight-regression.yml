name: Midnight transit regression
on:
  pull_request:
    branches: [main]
jobs:
  midnight-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run midnight route UI and API tests
        run: node --test tests/firstLastMidnight.test.cjs tests/firstLastEmptyList.test.cjs
